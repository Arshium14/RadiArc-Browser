name: Build iPad IPA

# Compiles the Sol Browser iPad app on a macOS runner and packages an unsigned IPA
# that can be re-signed and sideloaded with SideStore / AltStore / Sideloadly.
# The simulator build is the compile gate; the device build produces the artifact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package unsigned IPA
    # macos-14 images were retired 2026-11-02; macos-15 ships Xcode 16 (iOS 18 SDK),
    # required for the #available(iOS 18) APIs used in the settings sheets.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Aura.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Aura.xcodeproj \
            -scheme Aura \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Compile check (iOS Simulator, Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned device app (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/Sol Browser.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Sol Browser.app not found at $APP_PATH"
            find DerivedData/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Sol-Browser-unsigned.ipa Payload
          ls -lh Sol-Browser-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sol-Browser-unsigned-ipa
          path: Sol-Browser-unsigned.ipa
          if-no-files-found: error
          retention-days: 30